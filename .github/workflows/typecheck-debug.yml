name: TypeScript diagnostics
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnostics:
    if: github.event.head_commit.message != 'Capture TypeScript diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Capture diagnostics
        run: |
          set +e
          npm run typecheck > typecheck-errors.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> typecheck-errors.txt
          exit 0
      - name: Commit diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const content=fs.readFileSync('typecheck-errors.txt','utf8');
            const owner=context.repo.owner, repo=context.repo.repo, path='typecheck-errors.txt';
            let sha;
            try { const r=await github.rest.repos.getContent({owner,repo,path,ref:context.sha}); sha=r.data.sha; } catch(e) {}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'Capture TypeScript diagnostics',content:Buffer.from(content).toString('base64'),sha,branch:'main'});
